<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎬 포스터 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --accent: #FFD600;
    --accent2: #FF4B4B;
    --text: #f0f0f0;
    --muted: #888;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,214,0,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,75,75,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }

  .header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .header .title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(24px, 5vw, 42px);
    letter-spacing: -1px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(255,214,0,0.3);
    margin-bottom: 4px;
  }

  .header .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .progress-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.2rem;
    justify-content: center;
  }

  .dots { display: flex; gap: 8px; }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid #333;
    transition: all 0.3s;
  }
  .dot.done { background: var(--accent); border-color: var(--accent); }
  .dot.current { background: var(--accent2); border-color: var(--accent2); transform: scale(1.4); }
  .dot.practice { border-color: #7DF9FF; }
  .dot.practice.done { background: #7DF9FF; border-color: #7DF9FF; }
  .dot.practice.current { background: #7DF9FF; border-color: #7DF9FF; }
  .dot-divider { width: 1px; height: 16px; background: #333; margin: 0 4px; }

  .progress-text { font-size: 13px; color: var(--muted); min-width: 60px; text-align: right; }

  /* 퀴즈 카드 */
  .quiz-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid #2a2a2a;
    overflow: hidden;
  }

  .quiz-card.is-practice { border-color: rgba(125,249,255,0.25); }

  /* 이미지 영역 - 한 장씩 */
  .image-stage {
    position: relative;
    width: 100%;
    height: 480px;
    overflow: hidden;
    background: #111;
  }

  .poster-slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .poster-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* 애니 슬라이드: 기본 보임 */
  .slide-anime { opacity: 1; transform: translateX(0); }
  .slide-anime.exit { opacity: 0; transform: translateX(-60px); }

  /* 실제 슬라이드: 기본 숨김 */
  .slide-real { opacity: 0; transform: translateX(60px); }
  .slide-real.enter { opacity: 1; transform: translateX(0); }

  .panel-label {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 2;
  }
  .label-anime { color: #7DF9FF; }
  .label-real  { color: var(--accent); }

  /* 정보 영역 */
  .info-area {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .title-area { flex: 1; }

  .q-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .practice-badge {
    background: rgba(125,249,255,0.12);
    border: 1px solid rgba(125,249,255,0.35);
    color: #7DF9FF;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .answer-hidden {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 26px;
    color: #333;
    letter-spacing: 8px;
  }

  .answer-text {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 26px;
    color: var(--accent);
    display: none;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn-area { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

  .btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .btn-reveal { background: var(--accent2); color: #fff; }
  .btn-reveal:hover:not(:disabled) { background: #ff6b6b; }

  .btn-next-q { background: var(--accent); color: #000; }
  .btn-next-q:hover { background: #ffe033; }

  /* 네비게이션 */
  .nav-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.2rem;
    padding: 0 0.25rem;
  }

  .btn-nav {
    background: var(--surface);
    color: var(--text);
    border: 1px solid #2a2a2a;
    padding: 10px 20px;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-nav:hover:not(:disabled) { background: var(--surface2); border-color: #444; }
  .btn-nav:disabled { opacity: 0.3; cursor: default; }

  .nav-center { font-size: 13px; color: var(--muted); letter-spacing: 1px; }

  /* 엔딩 */
  .end-screen { display: none; text-align: center; padding: 4rem 2rem; }
  .end-screen.active { display: block; }
  .end-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 48px;
    color: var(--accent);
    margin-bottom: 12px;
    text-shadow: 0 0 40px rgba(255,214,0,0.4);
  }
  .end-sub { font-size: 16px; color: var(--muted); margin-bottom: 1.5rem; }

  @media (max-width: 600px) {
    .image-stage { height: 320px; }
    .info-area { flex-direction: column; align-items: flex-start; padding: 1rem; }
    .btn-area { flex-direction: row; width: 100%; }
    .btn { flex: 1; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="title">🎬 포스터 퀴즈</div>
    <div class="subtitle">Anime vs Real — 이 작품은 무엇일까요?</div>
    <button id="bgm-btn" onclick="toggleBGM()" style="margin-top:10px;background:#242424;border:1px solid #444;color:#f0f0f0;padding:7px 18px;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;">🔇 음악 켜기</button>
  </div>

  <audio id="bgm" src="Pictures/sonican-flash-quiz-loop-236356.mp3" loop></audio>

  <div class="progress-bar">
    <div class="dots" id="dots"></div>
    <div class="progress-text" id="prog-text">연습 1 / 2</div>
  </div>

  <div class="quiz-card" id="quiz-card">
    <div class="image-stage">
      <!-- 애니 슬라이드 -->
      <div class="poster-slide slide-anime" id="slide-anime">
        <div class="panel-label label-anime">✦ Anime Ver.</div>
        <img id="img-anime" src="" alt="애니메이션 포스터" />
      </div>
      <!-- 실제 포스터 슬라이드 -->
      <div class="poster-slide slide-real" id="slide-real">
        <div class="panel-label label-real">★ Real Poster</div>
        <img id="img-real" src="" alt="실제 포스터" />
      </div>
    </div>

    <div class="info-area">
      <div class="title-area">
        <div class="q-label" id="q-label">문제 1</div>
        <div class="answer-hidden" id="ans-hidden">? ? ? ? ?</div>
        <div class="answer-text" id="ans-text"></div>
      </div>
      <div class="btn-area">
        <button class="btn btn-reveal" id="btn-reveal" onclick="revealAnswer()">정답 공개 🔓</button>
      </div>
    </div>
  </div>

  <div class="nav-area">
    <button class="btn-nav" id="btn-prev" onclick="prevQ()" disabled>← 이전</button>
    <div class="nav-center" id="nav-center"></div>
    <button class="btn-nav" id="btn-next" onclick="nextQ()">다음 →</button>
  </div>

  <div class="end-screen" id="end-screen">
    <div class="end-title">🎉 완료!</div>
    <div class="end-sub">연습 2문제 + 본문제 9문제, 총 11문제 완료! 수고하셨습니다!</div>
    <button class="btn btn-next-q" style="padding:14px 40px;font-size:16px;" onclick="restart()">처음으로 돌아가기</button>
  </div>

</div>

<script>
const questions = [
  { practice: true,  title: "왕과 사는 남자",                      anime: "Pictures/p1_anime.png", real: "Pictures/p1_real.png" },
  { practice: true,  title: "재벌집 막내아들",                     anime: "Pictures/p2_anime.png", real: "Pictures/p2_real.png" },
  {                  title: "미스터 션샤인",                       anime: "Pictures/q1_anime.png", real: "Pictures/q1_real.png" },
  {                  title: "극한직업",                            anime: "Pictures/q2_anime.png", real: "Pictures/q2_real.png" },
  {                  title: "부산행",                              anime: "Pictures/q3_anime.png", real: "Pictures/q3_real.png" },
  {                  title: "비밀의 숲 2",                         anime: "Pictures/q4_anime.png", real: "Pictures/q4_real.png" },
  {                  title: "허수아비",                            anime: "Pictures/q5_anime.png", real: "Pictures/q5_real.png" },
  {                  title: "언젠가는 슬기로울 전공의생활",         anime: "Pictures/q6_anime.png", real: "Pictures/q6_real.png" },
  {                  title: "2012",                                anime: "Pictures/q7_anime.jpg", real: "Pictures/q7_real.jpg" },
  {                  title: "인셉션",                              anime: "Pictures/q8_anime.png", real: "Pictures/q8_real.png" },
  {                  title: "모두가 자신의 무가치함과 싸우고 있다", anime: "Pictures/q9_anime.png", real: "Pictures/q9_real.jpg"  },
];

const PRACTICE_COUNT = questions.filter(q => q.practice).length;
let cur = 0;
const state = questions.map(() => ({ revealed: false }));

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  questions.forEach((q, i) => {
    if (i === PRACTICE_COUNT) {
      const div = document.createElement('div');
      div.className = 'dot-divider';
      el.appendChild(div);
    }
    const d = document.createElement('div');
    const isPractice = q.practice ? ' practice' : '';
    const isDone = i < cur ? ' done' : '';
    const isCur  = i === cur ? ' current' : '';
    d.className = 'dot' + isPractice + isDone + isCur;
    el.appendChild(d);
  });
}

function getQLabel(i) {
  const q = questions[i];
  if (q.practice) {
    const pIdx = questions.slice(0, i+1).filter(x => x.practice).length;
    return { text: '연습 ' + pIdx, badge: true };
  } else {
    const qIdx = questions.slice(0, i+1).filter(x => !x.practice).length;
    return { text: '문제 ' + qIdx, badge: false };
  }
}

function getProgText(i) {
  const q = questions[i];
  if (q.practice) {
    const pIdx = questions.slice(0, i+1).filter(x => x.practice).length;
    return '연습 ' + pIdx + ' / ' + PRACTICE_COUNT;
  } else {
    const qIdx = questions.slice(0, i+1).filter(x => !x.practice).length;
    const total = questions.filter(x => !x.practice).length;
    return '문제 ' + qIdx + ' / ' + total;
  }
}

function loadQ() {
  const q = questions[cur];
  const s = state[cur];

  // 이미지 세팅
  document.getElementById('img-anime').src = q.anime;
  document.getElementById('img-real').src  = q.real;

  // 카드 스타일
  document.getElementById('quiz-card').className = 'quiz-card' + (q.practice ? ' is-practice' : '');

  // 라벨
  const labelInfo = getQLabel(cur);
  document.getElementById('q-label').innerHTML = labelInfo.text + (labelInfo.badge ? ' <span class="practice-badge">PRACTICE</span>' : '');

  const progStr = getProgText(cur);
  document.getElementById('prog-text').textContent = progStr;
  document.getElementById('nav-center').textContent = progStr;

  // 슬라이드 초기화
  const slideAnime = document.getElementById('slide-anime');
  const slideReal  = document.getElementById('slide-real');

  if (s.revealed) {
    // 이미 공개된 문제: 바로 정답 화면
    slideAnime.className = 'poster-slide slide-anime exit';
    slideReal.className  = 'poster-slide slide-real enter';
    document.getElementById('ans-hidden').style.display = 'none';
    document.getElementById('ans-text').textContent = q.title;
    document.getElementById('ans-text').style.display = 'block';
    document.getElementById('btn-reveal').disabled = true;
  } else {
    // 미공개: 애니 화면
    slideAnime.className = 'poster-slide slide-anime';
    slideReal.className  = 'poster-slide slide-real';
    document.getElementById('ans-hidden').style.display = 'block';
    document.getElementById('ans-text').style.display = 'none';
    document.getElementById('btn-reveal').disabled = false;
  }

  document.getElementById('btn-prev').disabled = (cur === 0);
  document.getElementById('btn-next').disabled = (cur === questions.length - 1);
  buildDots();
}

function revealAnswer() {
  state[cur].revealed = true;
  const q = questions[cur];

  document.getElementById('btn-reveal').disabled = true;

  // 애니 슬라이드 왼쪽으로 퇴장
  document.getElementById('slide-anime').classList.add('exit');

  // 실제 포스터 오른쪽에서 등장
  document.getElementById('slide-real').classList.add('enter');

  // 전환 완료 후 정답 텍스트 표시
  setTimeout(() => {
    document.getElementById('ans-hidden').style.display = 'none';
    document.getElementById('ans-text').textContent = q.title;
    document.getElementById('ans-text').style.display = 'block';
  }, 500);
}

function nextQ() {
  if (cur < questions.length - 1) {
    cur++;
    loadQ();
  } else {
    document.getElementById('quiz-card').style.display = 'none';
    document.querySelector('.nav-area').style.display = 'none';
    document.getElementById('end-screen').classList.add('active');
  }
}

function prevQ() {
  if (cur > 0) { cur--; loadQ(); }
}

function restart() {
  cur = 0;
  state.forEach(s => { s.revealed = false; });
  document.getElementById('quiz-card').style.display = '';
  document.querySelector('.nav-area').style.display = '';
  document.getElementById('end-screen').classList.remove('active');
  loadQ();
}

function toggleBGM() {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('bgm-btn');
  if (bgm.paused) {
    bgm.play();
    btn.textContent = '🔊 음악 끄기';
  } else {
    bgm.pause();
    btn.textContent = '🔇 음악 켜기';
  }
}

loadQ();
</script>
</body>
</html>
